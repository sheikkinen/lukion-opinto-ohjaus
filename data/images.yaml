      - {topic: op2-15-haku-ja-valinta, section: "front matter: suggested_timing (year 3, syksy)"}
      - {topic: op2-18-urasuunnitelma, section: "front matter: suggested_timing (year 3, kevät)"}
      - {topic: docs/content-contract.md, section: "suggested_timing: the page always adds 'esimerkki, koulu päättää'"}

  - id: dg-itseopiskelun-askel
    kind: diagram
    model: nano-banana
    aspect: "1:1"
    page: op1-01-lukio-alkaa
    placement: Itseopiskelun askel
    prompt: >-
      A clean flat infographic on a pure white background, high contrast, dark slate text, simple sans-serif font,
      generous spacing. Four rounded nodes placed clockwise on a circle and joined by curved clockwise arrows, so the
      loop reads: top "Lue", right "Tee yksi tehtävä", bottom "Pohdi", left "Seuraava askel", and the arrow from
      "Seuraava askel" returns to "Lue". Each node has a simple abstract icon without letters (an open book, a
      pencil, a thought bubble, a footstep). In the centre of the circle a muted teal rounded box reading
      "Kirjaa HOPSiin". Use exactly these Finnish texts, spelled exactly as written, each once, and no other text,
      numbers, logos or watermark.
    alt: >-
      Kaavio itseopiskelun askeleesta kehänä: lue, tee yksi tehtävä, pohdi ja siirry seuraavaan askeleeseen,
      jonka jälkeen kehä alkaa alusta. Keskellä teksti: kirjaa HOPSiin.
    expected_labels:
      - "Lue"
      - "Tee yksi tehtävä"
      - "Pohdi"
      - "Seuraava askel"
      - "Kirjaa HOPSiin"
    facts_from:
      - {topic: front, section: "content/pages/etusivu.md / Näin sivustoa käytetään"}
      - {topic: polku, section: "content/pages/polku.md (lue, tee yksi tehtävä, pohdi, seuraava askel; HOPS)"}
