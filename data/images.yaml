      - {topic: op1-06-hops, section: "front matter: suggested_timing (year 1, syksy)"}
      - {topic: op1-07-ylioppilastutkinto, section: "front matter: suggested_timing (year 1, kevät)"}
      - {topic: op2-10-suunnitelmien-paivitys, section: "front matter: suggested_timing (year 2, syksy)"}
