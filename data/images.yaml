  - id: dg-ohjauksen-aikajana
    kind: diagram
    model: nano-banana
    aspect: "16:9"
    page: op1-01-lukio-alkaa
    placement: Opiskelijalle
    prompt: >-
      A clean flat infographic timeline on a pure white background, high contrast, dark slate text, simple
      sans-serif font, generous spacing. A small tag in the top right corner reading "Esimerkki, koulu päättää".
      A horizontal timeline divided into three equal columns headed "1. vuosi", "2. vuosi" and "3. vuosi". Above
      the first column a muted teal band reading "OP1"; above the second and third columns together one warm sand
      band reading "OP2". Each column holds two rounded cards, an upper one marked "Syksy" and a lower one marked
      "Kevät" (so "Syksy" and "Kevät" each appear three times, once per column). Card texts: 1. vuosi Syksy
      "Lukio alkaa ja HOPS", 1. vuosi Kevät "Alustava yo-suunnitelma", 2. vuosi Syksy "Suunnitelmien päivitys",
      2. vuosi Kevät "Koulutusväylät", 3. vuosi Syksy "Haku ja valinta", 3. vuosi Kevät "Jatko-opinto- ja
      urasuunnitelma". Use exactly these Finnish texts, spelled exactly as written, and no other text, dates,
      logos or watermark.
    alt: >-
      Esimerkkiaikajana opinto-ohjauksesta lukion kolmena vuotena; koulu päättää oman aikataulunsa. Moduuli OP1
      on ensimmäisenä vuonna ja moduuli OP2 toisena ja kolmantena vuonna. Ensimmäisen vuoden syksy: lukio alkaa
      ja HOPS. Ensimmäisen vuoden kevät: alustava yo-suunnitelma. Toisen vuoden syksy: suunnitelmien päivitys.
      Toisen vuoden kevät: koulutusväylät. Kolmannen vuoden syksy: haku ja valinta. Kolmannen vuoden kevät:
      jatko-opinto- ja urasuunnitelma.
