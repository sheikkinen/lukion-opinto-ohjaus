# Vuosittain muuttuvat tiedot. Aiheet linkittävät näihin eivätkä kopioi lukuja.
# read = päivä, jolloin sivu avattiin. note = mitä ei voitu varmistaa.
facts:
  - key: ytl_exam_dates
    rule: Ylioppilastutkinnon koepäivät vahvistaa Ylioppilastutkintolautakunta erikseen kutakin koetta ja tutkintokertaa varten, joten päivät katsotaan aina lautakunnan sivulta.
    url: https://www.ylioppilastutkinto.fi/fi/tutkinnon-suorittaminen/koepaivat
    publisher: Ylioppilastutkintolautakunta
    read: 2026-11-21
  - key: ytl_enrolment_deadline
    rule: Ylioppilaskokeisiin ilmoittaudutaan oman lukion kautta, ilmoittautuminen on sitova, ja koulu voi asettaa sisäisen määräajan lautakunnan määräaikaa aikaisemmaksi.
    url: https://www.ylioppilastutkinto.fi/fi/tutkinnon-suorittaminen/ilmoittautuminen
    publisher: Ylioppilastutkintolautakunta
    read: 2026-11-21
  - key: ytl_fees
    rule: Ylioppilaskokeista peritään tutkintomaksuja, ja niiden suuruus vahvistetaan erikseen, joten maksut katsotaan lautakunnan maksusivulta.
    url: https://www.ylioppilastutkinto.fi/fi/tutkinnon-suorittaminen/ilmoittautuminen/tutkintomaksut
    publisher: Ylioppilastutkintolautakunta
    read: 2026-11-21
    note: Sivu avattiin. Sivun mukaan kokeiden uusimisen maksut ovat uusimissivulla, jota ei avattu tässä ajossa.
  - key: ytl_rules_changes
    rule: Ylioppilastutkinnon säännöt, koejärjestelmä ja kokeet voivat muuttua uudistusten myötä, joten tuoreimmat muutokset luetaan lautakunnan omilta sivuilta.
    url: https://www.ylioppilastutkinto.fi/fi/tietopalvelut/tietoa-ylioppilastutkinnosta
    publisher: Ylioppilastutkintolautakunta
    read: 2026-11-21
    note: Osoite https://www.ylioppilastutkinto.fi/fi/ylioppilastutkinto ohjautuu nykyään tähän tietopalvelusivuun. Sivu avattiin, mutta yksittäisiä uudistuksia (esimerkiksi englannin kokeen muutosta) ei vahvistettu siitä. Vain etusivu linkitetään.
  - key: joint_application_windows
    rule: Yhteishakujen hakuajat vaihtelevat vuosittain, ja ne katsotaan Opintopolun hakuaikataulusivulta.
    url: https://opintopolku.fi/konfo/fi/sivu/hakuaikataulut
    publisher: Opetushallitus (Opintopolku)
    read: 2026-11-21
    note: Opintopolku on JavaScript-sovellus. Sivu avattiin selaimella (Chrome) 2026-11-21, ja se näyttää hakuajat ja tulosten julkistamisajat täysin. Vakaa osoite riittää, varalinkkiä ei tarvita.
  - key: admission_results_dates
    rule: Valintojen tulosten julkistamisajat vaihtelevat haun mukaan, ja ne löytyvät Opintopolusta ja kunkin haun tiedoista.
    url: https://opintopolku.fi/konfo/fi/sivu/hakuaikataulut
    publisher: Opetushallitus (Opintopolku)
    read: 2026-11-21
    note: Sama sivu kuin joint_application_windows. Se näyttää myös tulosten julkistamisajat.
  - key: places_and_quota
    rule: Aloituspaikkojen määrät ja ensikertalaiskiintiön osuus vaihtelevat haun ja koulutuksen mukaan, ja ne katsotaan koulutuksen omalta Opintopolun sivulta.
    url: https://opintopolku.fi/konfo/fi/
    publisher: Opetushallitus (Opintopolku)
    read: 2026-11-21
    note: Etusivu avattiin selaimella. Paikka- ja kiintiötietoa ei vahvistettu siltä, koska se on koulutuskohtaisilla sivuilla. Linkitetään vakaa etusivu.
  - key: todistusvalinta_tables
    rule: Yliopistojen todistusvalinnan pisteytys ja ammattikorkeakoulujen valintaperusteet vaihtelevat, ja voimassa olevat taulukot katsotaan Yliopistovalinnat.fi-sivustolta ja Opintopolusta.
    url: https://yliopistovalinnat.fi/todistusvalinta
    publisher: Yliopistovalinnat.fi (suomalaiset yliopistot)
    read: 2026-11-21
    note: Osoite https://www.yliopistovalinnat.fi/fi/todistusvalinta ohjautuu nykyään osoitteeseen yliopistovalinnat.fi/todistusvalinta. Sivu avattiin. Pisteytystaulukot ovat sen linkkaamilla alasivuilla, joiden osoite sisältää vuoden, joten niitä ei käytetä pysyvänä linkkinä.
  - key: cut_off_points
    rule: Aiempien vuosien pisterajat ovat tilastoa, joka ei kerro tulevan haun rajaa, ja ne katsotaan Vipusesta.
    url: https://vipunen.fi/
    publisher: Opetushallinnon tilastopalvelu Vipunen
    read: 2026-11-21
    note: WebFetch sai vastauksen 403. Etusivu avattiin selaimella (Chrome --dump-dom), mutta pisteraja-raporttia ei avattu, joten linkki on palvelun etusivulle.
  - key: entrance_exam_dates
    rule: Valintakokeiden ajankohdat vaihtelevat koulutuksen ja haun mukaan, ja ne katsotaan Yliopistovalinnat.fi-sivustolta ja Opintopolun koulutuskohtaisilta sivuilta.
    url: https://www.yliopistovalinnat.fi/
    publisher: Yliopistovalinnat.fi (suomalaiset yliopistot)
    read: 2026-11-21
    note: Etusivu avattiin. Se ei itse anna päiviä, vaan linkittää todistusvalinnan ja valintakokeiden sivuille. Ammattikorkeakoulujen valintakokeet ovat Opintopolussa.
  - key: kela_student_aid
    rule: Opintoraha, asumislisä, opintolaina, niiden tulorajat ja koulumatkatuki määräytyvät Kelan ohjeiden mukaan ja muuttuvat, joten summat ja rajat katsotaan Kelan sivuilta.
    url: https://www.kela.fi/opiskelu
    publisher: Kela
    read: 2026-11-21
    note: Osoite https://www.kela.fi/opintotuki ohjautuu nykyään Kelan opiskelusivulle (kela.fi/opiskelu), joka on yleinen opiskelijan sivu ilman omaa opintotukisivua. Siksi linkki on opiskelusivulle, ja sieltä jatketaan opintotuen alasivuille. Koulumatkatukea ja YTHS-maksua ei vahvistettu siitä.
  - key: intti_callups
    rule: Kutsuntojen ajankohdat ja ikäluokka sekä naisten vapaaehtoisen asepalveluksen hakuaika ilmoitetaan Puolustusvoimien Intti.fi-sivustolla.
    url: https://intti.fi/
    publisher: Puolustusvoimat
    read: 2026-11-21
  - key: civil_service
    rule: Siviilipalvelus on vaihtoehto asevelvollisille, joiden vakaumus estää aseellisen varusmiespalveluksen. Hakemisen ehdot ja ajankohta luetaan Intti.fi-sivuston sivulta Muut palvelusvaihtoehdot ja palveluksesta vapautetut, joten palveluksen pituutta tai hakuohjeita ei toisteta.
    url: https://intti.fi/muut-palvelusvaihtoehdot-ja-palveluksesta-vapautetut
    publisher: Puolustusvoimat (Intti.fi)
    read: 2026-11-21
    note: Intti.fi:n etusivu ei itse käsittele siviilipalvelusta. Valikossa Intti edessä > Yksilölliset järjestelyt on linkki Muut palvelusvaihtoehdot ja palveluksesta vapautetut. Sivu avattiin 2026-11-21, ja siinä on osio siviilipalveluksesta asevelvollisille, joiden vakaumus estää varusmiespalveluksen. Aiempi osoite intti.fi/muut-palvelusvaihtoehdot antoi 404, ja oikea osoite on edellä. siviilipalvelus.fi ei auennut. Naisille ei ole siviilipalvelua, vaan vapaaehtoinen asepalvelus.
  - key: employment_services
    rule: Työnhaun ja työllisyyspalvelujen asiointi tapahtuu Työmarkkinatorilla, ja palvelujen järjestäjä ja kanavat voivat muuttua.
    url: https://tyomarkkinatori.fi/
    publisher: KEHA-keskus (Työmarkkinatori)
    read: 2026-11-21
    note: Sivu avattiin (henkilöasiakkaat, avoimet työpaikat, asiointi). Työllisyyspalvelujen siirtoa kunnille ei vahvistettu siitä, joten sääntö ei väitä sitä. Ammattinetti ei auennut (varmennevirhe WebFetchissä, tyhjä sivu Chromessa), joten sitä ei linkitetä.
  - key: learning_support_rules
    rule: Lukiolaisella on oikeus oppimisen tukeen ja erityisopetukseen, ja oikeutta tukeen on vahvistettu lukiolain muutoksella.
    url: https://www.oph.fi/fi/uutiset/2025/lukion-oppimisen-tuki-ja-erityisopetus-uudistuvat-oikeus-tukeen-vahvistuu
    publisher: Opetushallitus
    read: 2026-11-21
    stable_figures: ["20.3.2025", "1.8.2025"]
    note: Uutinen on julkaistu 20.3.2025, ja muutos tuli voimaan 1.8.2025. Aiheiden Tuki-linkki osoittaa vakaaseen OPH:n sivuun Oppimisen tuen uudistus (https://www.oph.fi/fi/oppimisen-tuen-uudistus), joka kertoo vain, että tukijärjestelmä uudistui. Oikeus tukeen on lukiolaissa, ja uutinen kertoo uudistuksen.
  - key: guidance_services
    rule: Opintopolun neuvonta ja ohjaus -sivu kokoaa neuvontapalvelujen yhteystiedot ja linkit muihin palveluihin, esimerkiksi Ohjaamoon. Opintopolku ei anna henkilökohtaista opinto- tai uraneuvontaa korkeakouluhakijoille, vaan heitä neuvovat korkeakoulujen hakijapalvelut. Neuvontakanavien aukioloajat ja paikalliset ohjauspalvelut katsotaan palvelujen omilta sivuilta.
    url: https://opintopolku.fi/konfo/fi/sivu/neuvonta-ja-ohjaus
    publisher: Opetushallitus (Opintopolku)
    read: 2026-11-21
    note: Sivu luettiin Chromella 2026-11-21, ja sen sisältö vastaa sääntöä. Opintopolun ohjeen mukaan se ei anna henkilökohtaista ohjausta korkeakouluhakijoille. Ohjaamoja ja hyvinvointipalveluita ei vahvistettu, ne linkitetään aiheissa erikseen.
  - key: curriculum_version
    rule: Lukion opetussuunnitelman perusteet 2019 on voimassa oleva valtakunnallinen opetussuunnitelma, ja sen sisältö luetaan ePerusteista ja Opetushallituksen julkaisusivulta.
    url: https://www.oph.fi/fi/tilastot-ja-julkaisut/julkaisut/lukion-opetussuunnitelman-perusteet-2019
    publisher: Opetushallitus
    read: 2026-11-21
    note: Sivu avattiin, eikä se mainitse muutoksia. ePerusteiden tietueen uusi julkaisu 2026-05-22 ja siihen liitetty muutos jäävät varmistamatta. Sivusto näyttää oman tarkistuspäivänsä.
  - key: international
    rule: Kansainvälisyyteen ja ulkomaille lähtöön liittyvät ohjelmat nuorille ja korkeakouluopiskelijoille löytyvät Opetushallituksen Kansainvälistymispalvelut yksilöille -sivulta, ja Suomeen tulevien kansainvälisten opiskelijoiden haku on Opintopolun englanninkielisessä Studyinfossa.
    url: https://www.oph.fi/fi/kansainvalisyys/kansainvalistymispalvelut-yksiloille
    publisher: Opetushallitus
    read: 2026-11-21
    note: Sivu avattiin. Se kertoo etenkin korkeakouluopiskelijoiden ulkomaanharjoittelusta, nuorten vapaaehtoistyöstä ja pohjoismaisesta Nordkurssista, ei yleisesti vaihto-opiskelusta tai tutkinnoista ulkomailla, joten tutkinto-opintoja koskeva lause ei saa nojata siihen yksin. Studyinfo (https://opintopolku.fi/konfo/en/) avattiin Chromella, ja studyinfo.fi ohjaa sinne. Vaihtojen määräaikoja ei vahvistettu. Euroguidance-sivu (https://www.oph.fi/en/development/euroguidance-supports-guidance-professionals) on ohjauksen ammattilaisille, ja aihe 16 mainitsee sen vain ohjaajan valmistelussa.
